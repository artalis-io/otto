# OTTO Base Hardening Configuration
# Include in service files: .include /etc/systemd/system/otto-base.conf
#
# See docs/internals/security-model.md for the full security architecture.

[Service]
# === Process Security ===
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectClock=true
ProtectHostname=true
ProtectKernelLogs=true
ProtectKernelModules=true
ProtectKernelTunables=true
ProtectControlGroups=true
RestrictSUIDSGID=true
LockPersonality=true
RestrictRealtime=true
RestrictNamespaces=true
MemoryDenyWriteExecute=true

# === Filesystem Security ===
ProtectSystem=strict
ProtectHome=true
ProtectProc=invisible
ProcSubset=pid

# === Capability Restrictions ===
CapabilityBoundingSet=
AmbientCapabilities=

# === Syscall Filtering ===
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@mount @reboot @swap @clock @cpu-emulation @debug @module @obsolete @raw-io @privileged

# === Resource Limits ===
LimitNOFILE=65536
LimitNPROC=512
TasksMax=256
MemoryMax=4G

# === Misc ===
UMask=0077
