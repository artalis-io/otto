<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clay Map Viewer - OTTO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Map tiles canvas (bottom layer) */
        #map-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #map-canvas.dragging {
            cursor: grabbing;
        }

        /* Clay UI canvas (top layer) */
        #ui-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Loading overlay */
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            z-index: 1000;
        }

        #loading h1 {
            font-size: 24px;
            margin-bottom: 16px;
        }

        #loading p {
            color: #888;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #4285f4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loading.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="map-canvas"></canvas>
        <canvas id="ui-canvas"></canvas>

        <div id="loading">
            <div class="spinner"></div>
            <h1>Clay Map Viewer</h1>
            <p>Loading WASM module...</p>
        </div>
    </div>

    <script type="module" src="map.js"></script>
</body>
</html>
