name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================================================
  # Run tests before release
  # ==========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build and test
        run: make test

  # ==========================================================================
  # Build and push Docker images
  # ==========================================================================
  docker:
    name: Build and Push Docker
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push full image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract API metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push API-only image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: api-only
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Create GitHub Release
  # ==========================================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test, docker]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install C dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build C libraries
        run: make all

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build

      - name: Create release archives
        run: |
          # Create source archive
          git archive --format=tar.gz --prefix=fuelwise-${{ github.ref_name }}/ HEAD > fuelwise-${{ github.ref_name }}-source.tar.gz

          # Create binary archive (libraries)
          mkdir -p release/lib release/include
          cp ralph/libralph.a release/lib/
          cp fuelwise/libfuelwise.a release/lib/
          cp -r ralph/include/* release/include/
          cp -r fuelwise/include/* release/include/
          cp api/fuelwise-api release/
          tar -czvf fuelwise-${{ github.ref_name }}-linux-x64.tar.gz -C release .

          # Create UI archive
          tar -czvf fuelwise-${{ github.ref_name }}-ui.tar.gz -C ui/dist .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            fuelwise-${{ github.ref_name }}-source.tar.gz
            fuelwise-${{ github.ref_name }}-linux-x64.tar.gz
            fuelwise-${{ github.ref_name }}-ui.tar.gz

  # ==========================================================================
  # Build WASM and attach to release
  # ==========================================================================
  wasm:
    name: Build WASM Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.51'

      - name: Build WASM
        run: |
          cd wasm
          emmake make

      - name: Create WASM archive
        run: |
          tar -czvf fuelwise-${{ github.ref_name }}-wasm.tar.gz -C wasm/build .

      - name: Attach to Release
        uses: softprops/action-gh-release@v1
        with:
          files: fuelwise-${{ github.ref_name }}-wasm.tar.gz
