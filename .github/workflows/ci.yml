name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']  # Run Docker builds on version tags
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      build_docker:
        description: 'Build Docker images'
        required: false
        default: false
        type: boolean

jobs:
  # ==========================================================================
  # Build and test C libraries -- one job per suite.
  #
  # This was a single sequential job, so it stopped at the first failing suite.
  # FuelWise was red for months and everything ordered after it -- Velo, Carta,
  # Locus -- simply never ran in that time; when the FuelWise bug was finally
  # fixed there was no way to know whether anything behind it had rotted. With
  # `fail-fast: false`, a red run now names every broken suite instead of just
  # the first.
  #
  # The old job also ran the Ralph sub-suites twice: root `make test-ralph`
  # already chains test-lap, test-netflow, test-netlib and test-detect, and the
  # job then re-ran three of them as separate steps. They are split out here as
  # their own suites and invoked directly, so each is reported once.
  #
  # Every suite's build target is self-sufficient: ralph, velo, carta and locus
  # each have a rule that builds ../shared/libshared.a on demand, so no job
  # depends on an earlier one having run.
  # ==========================================================================
  test-c:
    name: Test ${{ matrix.suite.name }}
    runs-on: ubuntu-latest

    strategy:
      # One broken suite should not hide the state of the others.
      fail-fast: false
      matrix:
        suite:
          - name: Shared
            build: make shared
            test: make test-shared
          - name: Ralph
            build: make ralph
            test: make -C ralph test
          - name: Ralph Transport
            build: make ralph
            test: make -C ralph test-transport
          - name: FuelWise Transport
            build: make fuelwise
            test: make -C fuelwise test-transport
          - name: Surge Transport
            build: make surge
            test: make -C surge test-transport
          - name: Ralph LAP
            build: make ralph
            test: make -C ralph test-lap
          - name: Ralph Netflow
            build: make ralph
            test: make -C ralph test-netflow
          - name: Ralph Netlib
            build: make ralph
            test: make -C ralph test-netlib
          - name: Ralph Detect
            build: make ralph
            test: make -C ralph test-detect
          - name: FuelWise
            build: make fuelwise
            test: make test-fuelwise
          - name: Velo
            build: make velo
            test: make test-velo
          - name: Carta
            build: make carta
            test: make test-carta
          - name: Locus
            build: make locus
            test: make test-locus
          # Nexus was never in CI at all. Its 182 assertions ran nowhere, and
          # test_regex_differential only means anything on a platform that has a
          # POSIX <regex.h> for the vendored engine to be compared against --
          # which is this one.
          - name: Nexus
            build: make nexus
            test: make test-nexus

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev glpk-utils

      - name: Build ${{ matrix.suite.name }}
        run: ${{ matrix.suite.build }}

      - name: Test ${{ matrix.suite.name }}
        run: ${{ matrix.suite.test }}

  # ==========================================================================
  # Arbor + Surge (Keel-backed API)
  #
  # Deliberately a standalone job with no `needs:`. These ran nowhere before,
  # and folding them into test-c would mean an unrelated failure earlier in
  # that sequential job silently skips them.
  # ==========================================================================
  test-surge:
    name: Test Arbor + Surge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build and test Arbor
        run: |
          make arbor
          make test-arbor

      - name: Build and test Surge
        run: |
          make surge
          make test-surge

      # Surge API is served by Keel (vendor/keel submodule)
      - name: Build Surge API
        run: |
          make surge-api
          ./surge/api/surge-solver --help > /dev/null

      # Actually start the server and exercise the endpoints. Building and
      # --help never start it, which is how a startup crash stayed green.
      - name: Test Surge API
        timeout-minutes: 5
        run: cd surge/api && bash test_api.sh



  # ==========================================================================
  # Ralph API (Keel-backed)
  #
  # Standalone for the same reason as test-surge: this lived in test-api,
  # which is gated behind test-c, so an unrelated failure there skipped it.
  # ==========================================================================
  test-ralph-api:
    name: Test Ralph API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build Ralph API
        run: |
          make ralph-api
          ./ralph/api/ralph-solver-server --help > /dev/null

      - name: Test Ralph API
        timeout-minutes: 5
        run: bash ralph/api/test_api.sh

  # ==========================================================================
  # FuelWise API (Keel-backed)
  #
  # Standalone for the same reason as test-surge / test-ralph-api: this
  # lived in test-api, which is gated behind test-c, so an unrelated
  # failure there skipped it. test_api.sh exits non-zero on failure, so
  # unlike the Ralph target this one is a real gate.
  # ==========================================================================
  test-fuelwise-api:
    name: Test FuelWise API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build FuelWise API
        run: |
          make -C fuelwise/api
          ./fuelwise/api/fuelwise-api --help > /dev/null

      - name: Test FuelWise API
        run: make -C fuelwise/api test




  # ==========================================================================
  # Velo API (Keel-backed)
  #
  # Standalone, and unlike the old build-only step this actually starts the
  # server and issues routes. Velo needs an OSM graph, so the job builds one
  # from Monaco (~700KB, the Makefile already fetches it).
  # ==========================================================================
  test-velo-api:
    name: Test Velo API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build Velo API
        run: |
          make velo-api
          ./velo/api/velo-route-server --help > /dev/null

      # bench_pbf is the PBF->.vlg builder; it is not part of `make velo`.
      - name: Build Monaco graph
        run: |
          make -C velo bench_pbf
          make data/monaco.vlg

      - name: Test Velo API
        timeout-minutes: 5
        run: bash velo/api/test_api.sh

  # ==========================================================================
  # Carta API (Keel-backed)
  #
  # Standalone, and it starts the server and renders real tiles. Carta needs
  # an OSM PBF, so the job uses Monaco (~700KB, fetched by the Makefile).
  # ==========================================================================
  test-carta-api:
    name: Test Carta API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build Carta API
        run: |
          make carta-api
          ./carta/api/carta-tile-server --help > /dev/null

      - name: Fetch Monaco PBF
        run: make data/monaco-latest.osm.pbf

      - name: Test Carta API
        timeout-minutes: 5
        run: bash carta/api/test_api.sh

  # ==========================================================================
  # Locus API (Keel-backed)
  #
  # Standalone, and it starts the server and issues real geocode queries.
  # Locus needs an OSM PBF, so the job uses Monaco (fetched by the Makefile).
  # ==========================================================================
  test-locus-api:
    name: Test Locus API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build Locus API
        run: |
          make locus-api
          ./locus/api/locus-geocoder --help > /dev/null

      - name: Fetch Monaco PBF
        run: make data/monaco-latest.osm.pbf

      - name: Test Locus API
        timeout-minutes: 5
        run: bash locus/api/test_api.sh

  # ==========================================================================
  # Windows
  #
  # OTTO targets native Windows, but nothing here built on it until sh_pal.h.
  # This job is what stops that rotting: a PAL only ever compiled on Linux is
  # a PAL nobody notices breaking.
  #
  # Covers every core library: shared/, velo/, carta/, locus/ and ralph/.
  # The API servers are what remain; they additionally need Keel built here.
  #
  # Two Ralph suites skip rather than run: lp_external_oop_run() spawns a
  # child process with fork/execvp over a non-blocking pipe, and the Windows
  # equivalent (CreateProcess + PeekNamedPipe) is a feature port rather than a
  # portability fix. They report SKIP so the gap stays visible.
  # ==========================================================================
  windows:
    name: Windows Core
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 + UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc

      - name: Build and run the PAL tests
        run: make -C shared test-pal

      - name: Build and test all of shared
        run: make -C shared test

      - name: Build and test Velo
        run: make -C velo test

      - name: Build and test Carta
        run: make -C carta test

      - name: Build and test Locus
        run: make -C locus test

      - name: Build and test Ralph
        run: make -C ralph test

      # Nexus did not compile on Windows at all until vendor/tre landed:
      # nx_validate.c and nx_xform.c both include <regex.h>, which is POSIX and
      # does not exist here. This is what stops that regressing.
      - name: Build and test Nexus
        run: make -C nexus test

      # test-lap is not part of `make -C ralph test` -- the Linux matrix runs it
      # as its own entry, and Windows never did. It belongs here more than
      # anywhere: three of its cases compare two timed arms, and this is the
      # platform with the coarsest clock. That gap was real. The suite measured
      # with clock(), whose tick is 15.6 ms here, so arms that run in about a
      # millisecond both read 0.000 ms and the ratios between them came out as
      # 0.00x and inf. It now measures with sh_monotonic_seconds() and scales
      # each benchmark until its baseline is worth dividing by.
      - name: Build and test Ralph LAP
        run: make -C ralph test-lap

      # The Linux matrix runs netflow, detect and netlib as their own entries;
      # Windows ran none of the three. netflow and detect already passed here --
      # 153 and 194 assertions that nobody was collecting. netlib could not run
      # at all: ralph-benchmark did not compile on Windows, because its NETLIB
      # harness forks a child per problem and <sys/wait.h> does not exist here.
      # That harness now has a Windows path, and this is what keeps it honest.
      - name: Build and test Ralph Netflow
        run: make -C ralph test-netflow

      - name: Build and test Ralph Detect
        run: make -C ralph test-detect

      - name: Build and test Ralph Netlib
        run: make -C ralph test-netlib

      # fuelwise and surge were missing here, and that is exactly why #63 shipped
      # a fuelwise link that had never been tried on Windows. Surge's own LDFLAGS
      # had the same hole, found the moment this step existed.
      #
      # The slow halves of both suites live in Windows Suites below; what stays
      # here is what gives fast feedback. FuelWise's unit suite is 2s and its
      # bench harness is a minute; Surge's transport test is instant and
      # test_surge is five minutes of actual solving.
      - name: Build and test FuelWise
        run: |
          make -C fuelwise test-transport
          make -C fuelwise test-unit

      - name: Build and test Surge
        run: make -C surge test-transport

      # Servers only build here -- their suites drive a live HTTP server with
      # curl, which is a bigger CI surface than this job needs today. Building
      # them proves Keel and the Keel-side shared helpers compile and link on
      # Windows, which is what was actually unknown.
      - name: Build the API servers
        run: |
          make -C ralph/api
          make -C fuelwise/api
          make -C surge/api
          make -C velo/api
          make -C carta/api
          make -C locus/api

  # ==========================================================================
  # macOS Core
  #
  # OTTO is developed on macOS, but CI only covered Linux and Windows -- a
  # macOS-specific break (Apple clang vs GCC, Homebrew libomp/glpk paths, BSD
  # vs GNU userland) could land unseen. This mirrors the Windows job: every
  # module's full suite plus a build of all six API servers.
  #
  # The Ralph and FuelWise Makefiles already select the macOS OpenMP flags
  # (-Xclang -fopenmp against Homebrew's libomp under /opt/homebrew, resolved
  # via `brew --prefix libomp`); macos-latest is Apple Silicon, so those paths
  # match. glpk supplies glpsol for FuelWise's MILP-objective regression.
  #
  # The live-server curl e2e suites are left out for the same reason as
  # Windows -- a bigger CI surface than this job needs. Both the full lib
  # suites and all six e2e suites were validated locally on macOS.
  # ==========================================================================
  macos:
    name: macOS Core
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install glpk libomp

      - name: Build and test all of shared
        run: make -C shared test

      - name: Build and test Ralph
        run: make -C ralph test

      - name: Build and test Velo
        run: make -C velo test

      - name: Build and test Carta
        run: make -C carta test

      - name: Build and test Locus
        run: make -C locus test

      - name: Build and test FuelWise
        run: make -C fuelwise test

      - name: Build and test Surge
        run: make -C surge test

      - name: Build and test Nexus
        run: make -C nexus test

      - name: Build the API servers
        run: |
          make -C ralph/api
          make -C fuelwise/api
          make -C surge/api
          make -C velo/api
          make -C carta/api
          make -C locus/api

  # ==========================================================================
  # Windows Suites
  #
  # The two Windows suites that are slow enough to be worth waiting for
  # separately, so Windows Core stays fast feedback rather than a ten-minute
  # gate on every push.
  #
  # Where the time went, from the Windows Core run on #68 (620s total):
  #
  #   Build and test Surge          338s
  #   Build and test Ralph           66s
  #   Build and test FuelWise        65s
  #   Build the API servers          54s
  #   toolchain setup + checkout     49s
  #   everything else                48s
  #
  # Of that Surge step, test_surge is ~297s on its own -- it is the 18k-line
  # suite and it actually solves. The other four Surge binaries together run
  # in under 1.5s. Of the FuelWise step, the bench regression is most of it.
  #
  # So this split is not "move the slow-looking thing": it moves the two
  # measured costs, which takes Windows Core to roughly three minutes and lets
  # it drop the glpk package, since only the bench harness shells out to
  # glpsol.
  # ==========================================================================
  windows-suites:
    name: Windows Suites
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 + UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-glpk

      # The full Surge suite. Windows Core runs its transport test, which is
      # the invariant; this is the solver behaviour.
      - name: Build and test Surge
        run: make -C surge test

      # The FuelWise benchmark regression compares Ralph's MILP objectives
      # against glpsol. Running that on Windows checks Ralph's numerics under a
      # different libm and compiler, not merely that the code compiles.
      - name: Build and run the FuelWise bench regression
        run: make -C fuelwise test-bench

  # ==========================================================================
  # Sanitizers
  #
  # A c-audit of the Phase 1 transport code found two heap overflows and an
  # out-of-bounds write in fresh memory-handling code. None were caught by the
  # compiler: those files were already clean under -Wall -Wextra -Wpedantic
  # -Wconversion -Wshadow -Wformat=2 -Wcast-align -Wnull-dereference, and still
  # are. Warning flags do not find that class of defect; ASan does, mechanically.
  #
  # Deliberately ungated and deliberately narrow. It targets the shared code
  # that async and streaming now run through, rather than every suite: Ralph's
  # full suite under -O0 + ASan would cost far more CI time for far less signal.
  # Widen it when a module's own memory handling starts changing.
  # ==========================================================================
  # Windows MSVC
  #
  # Every other Windows job here is MSYS2/MinGW. Until this existed, nothing in
  # CI ever ran cl.exe -- so "OTTO builds with MSVC" rested entirely on someone
  # running it by hand, and a contributor could break it without a single check
  # going red. mk/toolchain.mk carries the whole compiler difference; this is
  # what keeps it honest.
  #
  # The API servers are deliberately absent: they need Keel, which is MinGW-only
  # (13 of its 56 sources are on POSIX sockets). Everything that does build with
  # MSVC is here, and it is the same target list Windows Core runs, so a
  # divergence between the two compilers shows up as one job red and the other
  # green rather than as a mystery.
  #
  # mingw32-make, not MSYS's make: /usr/bin/make strips TMPDIR/TMP/TEMP from the
  # environment, and cl.exe needs them for its intermediates.
  # ==========================================================================
  windows-msvc:
    name: Windows MSVC
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 (make and coreutils only; the compiler is MSVC)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-make

      - name: Report the MSVC toolchain
        run: |
          source scripts/msvc-env.sh
          cl 2>&1 | head -2
          echo "cl:   $(command -v cl)"
          echo "link: $(command -v link)"
          echo "lib:  $(command -v lib)"

      - name: Build and run the PAL tests
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C shared CC=cl test-pal

      - name: Build and test all of shared
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C shared CC=cl test

      - name: Build and test Velo
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C velo CC=cl test

      - name: Build and test Carta
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C carta CC=cl test

      - name: Build and test Locus
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C locus CC=cl test

      - name: Build and test Ralph
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C ralph CC=cl test

      - name: Build and test Ralph LAP
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C ralph CC=cl test-lap

      - name: Build and test Ralph Netflow
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C ralph CC=cl test-netflow

      - name: Build and test Ralph Detect
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C ralph CC=cl test-detect

      # bore3d does not converge under strict IEEE arithmetic, which is what
      # MSVC gives; the harness records the timeout as a SKIP, so this passes
      # 25/25 where GCC passes 26/26. See docs/KNOWN_ISSUES.md.
      - name: Build and test Ralph Netlib
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C ralph CC=cl test-netlib

      - name: Build and test Arbor
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C arbor CC=cl test

      - name: Build and test Nexus
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C nexus CC=cl test

      - name: Build and test FuelWise
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C fuelwise CC=cl test-transport
          mingw32-make -C fuelwise CC=cl test-unit

      - name: Build and test Surge
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C surge CC=cl test-transport

      # ClayShards. The whole native stack reaches the terminal through
      # sh_pal.h -- is-stdout-a-tty, terminal size, raw mode, input bytes --
      # rather than termios/ioctl/signal, which is what lets it build here.
      # The tty demo is exercised headless: it renders frames to stdout with
      # no terminal involved, so it is the one part of a TUI that CI can
      # actually check.
      - name: Build and test ClayShards
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C clayshards/clay-shards CC=cl test
          mingw32-make -C clayshards/clay-shards-soft CC=cl test
          mingw32-make -C clayshards/clay-shards-tui CC=cl test
          mingw32-make -C clayshards/demos/tty CC=cl all
          ./clayshards/demos/tty/build/demo_tui_tty.exe --headless > /dev/null

  # ==========================================================================
  sanitizers:
    name: Sanitize ${{ matrix.suite.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: Shared
            target: test-asan
            dir: shared
          - name: Ralph Transport
            target: test-transport-asan
            dir: ralph
          - name: Arbor
            target: test-asan
            dir: arbor

    env:
      # UBSan only prints and keeps going by default, so a finding would not
      # fail the job. halt_on_error makes it fatal, which is the point.
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Sanitize ${{ matrix.suite.name }}
        run: make -C ${{ matrix.suite.dir }} ${{ matrix.suite.target }}

  # ==========================================================================
  # Build WebAssembly
  # ==========================================================================
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    # Deliberately ungated. This is a build, not a test: it takes a fresh
    # checkout, installs its own toolchain and runs `make wasm`, sharing no
    # artifacts with test-c. Gating it behind the suites meant an unrelated
    # test failure hid whether the WASM build itself still worked -- the same
    # reason build-docker stopped depending on test-c. Now that test-c is a
    # matrix, a `needs:` could not name individual suites anyway; it would
    # block on all ten.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.51'

      - name: Build all WASM modules
        run: make wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: |
            fuelwise/wasm/build/
            velo/wasm/build/
            carta/wasm/build/
            locus/wasm/build/
            ralph/wasm/build/
          retention-days: 7

  # ==========================================================================
  # Build Docker images (skipped by default, runs on tags or manual trigger)
  # ==========================================================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    # Gate on the jobs that actually exercise the servers being packaged.
    # This used to be `needs: test-c`, which is a sequential job covering
    # every C library -- so an unrelated failure there meant a release tag
    # produced no images at all.
    needs: [test-surge, test-ralph-api, test-fuelwise-api, test-velo-api, test-carta-api, test-locus-api]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_docker == 'true'

    strategy:
      # One broken image should not hide the state of the others.
      fail-fast: false
      matrix:
        service:
          - name: fuelwise
            dockerfile: docker/Dockerfile.fuelwise
            context: .
            target: ""
          - name: carta
            dockerfile: docker/Dockerfile.carta
            context: .
            target: ""
          - name: velo
            dockerfile: docker/Dockerfile.velo
            context: .
            target: ""
          - name: locus
            dockerfile: docker/Dockerfile.locus
            context: .
            target: ""
          - name: ralph
            dockerfile: docker/Dockerfile.ralph
            context: .
            target: ""
          - name: data-builder
            dockerfile: docker/Dockerfile.data-builder
            context: .
            target: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          target: ${{ matrix.service.target || '' }}
          push: false
          tags: ${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
