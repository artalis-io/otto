name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']  # Run Docker builds on version tags
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      build_docker:
        description: 'Build Docker images'
        required: false
        default: false
        type: boolean

jobs:
  # ==========================================================================
  # Build and test C libraries
  # ==========================================================================
  test-c:
    name: Test C Libraries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build and test Shared
        run: |
          make shared
          make test-shared

      - name: Build and test Ralph
        run: |
          make ralph
          make test-ralph

      - name: Test Ralph LAP
        run: make -C ralph test-lap

      - name: Test Ralph Netflow
        run: make -C ralph test-netflow

      - name: Test Ralph Detect
        run: make -C ralph test-detect

      - name: Build and test FuelWise
        run: |
          make fuelwise
          make test-fuelwise

      - name: Build and test Velo
        run: |
          make velo
          make test-velo

      - name: Build and test Carta
        run: |
          make carta
          make test-carta

      - name: Build and test Locus
        run: |
          make locus
          make test-locus

  # ==========================================================================
  # Build and test API servers
  # ==========================================================================
  test-api:
    name: Test API Servers
    runs-on: ubuntu-latest
    needs: test-c

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build all API servers
        run: |
          make fuelwise-api
          make carta-api
          make velo-api
          make locus-api
          make ralph-api

      - name: Test FuelWise API
        run: |
          ./fuelwise/api/fuelwise-api -p 8080 &
          sleep 2
          curl -sf http://localhost:8080/api/v1/health | grep -q '"status":"ok"'
          curl -sf -X POST http://localhost:8080/api/v1/solve \
            -H "Content-Type: application/json" \
            -d '{"total_distance":500,"tank_capacity":100,"current_fuel":30,"consumption_mpg":8,"minimum_fuel":10,"stations":[{"id":1,"distance":100,"price":3.50},{"id":2,"distance":300,"price":3.25}]}' \
            | grep -q '"status":"optimal"'
          pkill -f fuelwise-api || true

      - name: Test Carta API
        run: |
          # Carta needs PBF data - test health endpoint only
          ./carta/api/carta-tile-server --help > /dev/null
          echo "Carta API binary verified"

      - name: Test Velo API
        run: |
          # Velo needs graph data - test health endpoint only
          ./velo/api/velo-route-server --help > /dev/null
          echo "Velo API binary verified"

      - name: Test Locus API
        run: |
          # Locus needs index data - test health endpoint only
          ./locus/api/locus-geocoder --help > /dev/null
          echo "Locus API binary verified"

      - name: Test Ralph API
        run: |
          ./ralph/api/ralph-solver-server -p 8084 &
          sleep 2
          curl -sf http://localhost:8084/api/v1/health | grep -q '"status"'
          pkill -f ralph-solver-server || true

  # ==========================================================================
  # Build WebAssembly
  # ==========================================================================
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    needs: test-c

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.51'

      - name: Build all WASM modules
        run: make wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: |
            fuelwise/wasm/build/
            velo/wasm/build/
            carta/wasm/build/
            locus/wasm/build/
            ralph/wasm/build/
          retention-days: 7

  # ==========================================================================
  # Build Docker images (skipped by default, runs on tags or manual trigger)
  # ==========================================================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test-c
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_docker == 'true'

    strategy:
      matrix:
        service:
          - name: fuelwise
            dockerfile: Dockerfile
            context: .
            target: runtime
          - name: fuelwise-api
            dockerfile: Dockerfile
            context: .
            target: api-only
          - name: carta
            dockerfile: docker/Dockerfile.carta
            context: .
            target: ""
          - name: velo
            dockerfile: docker/Dockerfile.velo
            context: .
            target: ""
          - name: locus
            dockerfile: docker/Dockerfile.locus
            context: .
            target: ""
          - name: ralph
            dockerfile: docker/Dockerfile.ralph
            context: .
            target: ""
          - name: data-builder
            dockerfile: docker/Dockerfile.data-builder
            context: .
            target: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          target: ${{ matrix.service.target || '' }}
          push: false
          tags: ${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
