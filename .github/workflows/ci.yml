name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']  # Run Docker builds on version tags
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      build_docker:
        description: 'Build Docker images'
        required: false
        default: false
        type: boolean

jobs:
  # ==========================================================================
  # Build and test C libraries -- one job per suite.
  #
  # This was a single sequential job, so it stopped at the first failing suite.
  # FuelWise was red for months and everything ordered after it -- Velo, Carta,
  # Locus -- simply never ran in that time; when the FuelWise bug was finally
  # fixed there was no way to know whether anything behind it had rotted. With
  # `fail-fast: false`, a red run now names every broken suite instead of just
  # the first.
  #
  # The old job also ran the Ralph sub-suites twice: root `make test-ralph`
  # already chains test-lap, test-netflow, test-netlib and test-detect, and the
  # job then re-ran three of them as separate steps. They are split out here as
  # their own suites and invoked directly, so each is reported once.
  #
  # Every suite's build target is self-sufficient: ralph, velo, carta and locus
  # each have a rule that builds ../shared/libshared.a on demand, so no job
  # depends on an earlier one having run.
  # ==========================================================================
  test-c:
    name: Test ${{ matrix.suite.name }}
    runs-on: ubuntu-latest

    strategy:
      # One broken suite should not hide the state of the others.
      fail-fast: false
      matrix:
        suite:
          - name: Shared
            build: make shared
            test: make test-shared
          - name: Ralph
            build: make ralph
            test: make -C ralph test
          - name: Ralph Transport
            build: make ralph
            test: make -C ralph test-transport
          - name: FuelWise Transport
            build: make fuelwise
            test: make -C fuelwise test-transport
          - name: Surge Transport
            build: make surge
            test: make -C surge test-transport
          - name: Ralph LAP
            build: make ralph
            test: make -C ralph test-lap
          - name: Ralph Netflow
            build: make ralph
            test: make -C ralph test-netflow
          - name: Ralph Netlib
            build: make ralph
            test: make -C ralph test-netlib
          # These suites existed and were reachable only through targets no
          # workflow invoked -- `make -C ralph test-regression-suites` and
          # friends. They had never run in CI, which is the same shape of gap
          # that let the MPS writer ship invalid output behind a passing
          # `test_write_mps_roundtrip`. All pass today; gating them is what
          # keeps that true.
          - name: Ralph Regression Suites
            build: make ralph
            test: make -C ralph test-regression-suites
          - name: Ralph Benders
            build: make ralph
            test: make -C ralph test-benders
          - name: Ralph Optim
            build: make ralph
            test: make -C ralph test-optim
          - name: Ralph Edge Cases
            build: make ralph
            test: make -C ralph test-edge
          # The PAL is the platform seam, so running it on one platform
          # tests half of it. Windows Core has run it since it was written;
          # the POSIX branch was never executed by anything.
          - name: Shared PAL
            build: make shared
            test: make -C shared test-pal
          - name: Shared pdf2struc
            build: make shared
            test: make -C shared test-pdf2struc
          - name: Ralph Detect
            build: make ralph
            test: make -C ralph test-detect
          - name: FuelWise
            build: make fuelwise
            test: make test-fuelwise
          - name: Velo
            build: make velo
            test: make test-velo
          - name: Carta
            build: make carta
            test: make test-carta
          - name: Locus
            build: make locus
            test: make test-locus
          # Nexus was never in CI at all. Its 182 assertions ran nowhere, and
          # test_regex_differential only means anything on a platform that has a
          # POSIX <regex.h> for the vendored engine to be compared against --
          # which is this one.
          - name: Nexus
            build: make nexus
            test: make test-nexus

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev glpk-utils

      - name: Build ${{ matrix.suite.name }}
        run: ${{ matrix.suite.build }}

      - name: Test ${{ matrix.suite.name }}
        run: ${{ matrix.suite.test }}

  # ==========================================================================
  # Arbor + Surge (Keel-backed API)
  #
  # Deliberately a standalone job with no `needs:`. These ran nowhere before,
  # and folding them into test-c would mean an unrelated failure earlier in
  # that sequential job silently skips them.
  # ==========================================================================
  test-surge:
    name: Test Arbor + Surge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build and test Arbor
        run: |
          make arbor
          make test-arbor

      - name: Build and test Surge
        run: |
          make surge
          make test-surge

      # surge_map GeoJSON core self-test (python3; Linux only -- kept out of the
      # C `test` target so the Windows jobs without python3 stay green).
      - name: Test Surge scripts
        run: make -C surge scripts-test

      # Surge API is served by Keel (vendor/keel submodule)
      - name: Build Surge API
        run: |
          make surge-api
          ./surge/api/surge-solver --help > /dev/null

      # Actually start the server and exercise the endpoints. Building and
      # --help never start it, which is how a startup crash stayed green.
      - name: Test Surge API
        timeout-minutes: 5
        run: cd surge/api && bash test_api.sh

      # The same suite again, against a server built with ASan and UBSan.
      #
      # These six are the only OTTO code that reads bytes off a socket and
      # were the only modules never built with a sanitizer. Appended to this
      # job rather than given its own so the fixtures fetched above are
      # reused rather than fetched twice.
      #
      # test_api.sh judges the server by what curl gets back, which cannot
      # see a diagnostic on the server's stderr -- so the script now also
      # greps the server log and fails on anything a sanitizer produced.
      # Without that this step would be a job that cannot go red.
      - name: Test Surge API under ASan/UBSan
        run: make -C surge/api test-asan



  # ==========================================================================
  # Ralph API (Keel-backed)
  #
  # Standalone for the same reason as test-surge: this lived in test-api,
  # which is gated behind test-c, so an unrelated failure there skipped it.
  # ==========================================================================
  test-ralph-api:
    name: Test Ralph API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build Ralph API
        run: |
          make ralph-api
          ./ralph/api/ralph-solver-server --help > /dev/null

      - name: Test Ralph API
        timeout-minutes: 5
        run: bash ralph/api/test_api.sh

      # The same suite again, against a server built with ASan and UBSan.
      #
      # These six are the only OTTO code that reads bytes off a socket and
      # were the only modules never built with a sanitizer. Appended to this
      # job rather than given its own so the fixtures fetched above are
      # reused rather than fetched twice.
      #
      # test_api.sh judges the server by what curl gets back, which cannot
      # see a diagnostic on the server's stderr -- so the script now also
      # greps the server log and fails on anything a sanitizer produced.
      # Without that this step would be a job that cannot go red.
      - name: Test Ralph API under ASan/UBSan
        run: make -C ralph/api test-asan

  # ==========================================================================
  # FuelWise API (Keel-backed)
  #
  # Standalone for the same reason as test-surge / test-ralph-api: this
  # lived in test-api, which is gated behind test-c, so an unrelated
  # failure there skipped it. test_api.sh exits non-zero on failure, so
  # unlike the Ralph target this one is a real gate.
  # ==========================================================================
  test-fuelwise-api:
    name: Test FuelWise API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build FuelWise API
        run: |
          make -C fuelwise/api
          ./fuelwise/api/fuelwise-api --help > /dev/null

      - name: Test FuelWise API
        run: make -C fuelwise/api test

      # The same suite again, against a server built with ASan and UBSan.
      #
      # These six are the only OTTO code that reads bytes off a socket and
      # were the only modules never built with a sanitizer. Appended to this
      # job rather than given its own so the fixtures fetched above are
      # reused rather than fetched twice.
      #
      # test_api.sh judges the server by what curl gets back, which cannot
      # see a diagnostic on the server's stderr -- so the script now also
      # greps the server log and fails on anything a sanitizer produced.
      # Without that this step would be a job that cannot go red.
      - name: Test FuelWise API under ASan/UBSan
        run: make -C fuelwise/api test-asan




  # ==========================================================================
  # Velo API (Keel-backed)
  #
  # Standalone, and unlike the old build-only step this actually starts the
  # server and issues routes. Velo needs an OSM graph, so the job builds one
  # from Monaco (~700KB, the Makefile already fetches it).
  # ==========================================================================
  test-velo-api:
    name: Test Velo API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build Velo API
        run: |
          make velo-api
          ./velo/api/velo-route-server --help > /dev/null

      # bench_pbf is the PBF->.vlg builder; it is not part of `make velo`.
      - name: Build Monaco graph
        run: |
          make -C velo bench_pbf
          make data/monaco.vlg

      - name: Test Velo API
        timeout-minutes: 5
        run: bash velo/api/test_api.sh

      # The same suite again, against a server built with ASan and UBSan.
      #
      # These six are the only OTTO code that reads bytes off a socket and
      # were the only modules never built with a sanitizer. Appended to this
      # job rather than given its own so the fixtures fetched above are
      # reused rather than fetched twice.
      #
      # test_api.sh judges the server by what curl gets back, which cannot
      # see a diagnostic on the server's stderr -- so the script now also
      # greps the server log and fails on anything a sanitizer produced.
      # Without that this step would be a job that cannot go red.
      - name: Test Velo API under ASan/UBSan
        run: make -C velo/api test-asan

  # ==========================================================================
  # Carta API (Keel-backed)
  #
  # Standalone, and it starts the server and renders real tiles. Carta needs
  # an OSM PBF, so the job uses Monaco (~700KB, fetched by the Makefile).
  # ==========================================================================
  test-carta-api:
    name: Test Carta API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build Carta API
        run: |
          make carta-api
          ./carta/api/carta-tile-server --help > /dev/null

      - name: Fetch Monaco PBF
        run: make data/monaco-latest.osm.pbf

      - name: Test Carta API
        timeout-minutes: 5
        run: bash carta/api/test_api.sh

      # The same suite again, against a server built with ASan and UBSan.
      #
      # These six are the only OTTO code that reads bytes off a socket and
      # were the only modules never built with a sanitizer. Appended to this
      # job rather than given its own so the fixtures fetched above are
      # reused rather than fetched twice.
      #
      # test_api.sh judges the server by what curl gets back, which cannot
      # see a diagnostic on the server's stderr -- so the script now also
      # greps the server log and fails on anything a sanitizer produced.
      # Without that this step would be a job that cannot go red.
      - name: Test Carta API under ASan/UBSan
        run: make -C carta/api test-asan

  # ==========================================================================
  # Locus API (Keel-backed)
  #
  # Standalone, and it starts the server and issues real geocode queries.
  # Locus needs an OSM PBF, so the job uses Monaco (fetched by the Makefile).
  # ==========================================================================
  test-locus-api:
    name: Test Locus API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build Locus API
        run: |
          make locus-api
          ./locus/api/locus-geocoder --help > /dev/null

      - name: Fetch Monaco PBF
        run: make data/monaco-latest.osm.pbf

      - name: Test Locus API
        timeout-minutes: 5
        run: bash locus/api/test_api.sh

      # The same suite again, against a server built with ASan and UBSan.
      #
      # These six are the only OTTO code that reads bytes off a socket and
      # were the only modules never built with a sanitizer. Appended to this
      # job rather than given its own so the fixtures fetched above are
      # reused rather than fetched twice.
      #
      # test_api.sh judges the server by what curl gets back, which cannot
      # see a diagnostic on the server's stderr -- so the script now also
      # greps the server log and fails on anything a sanitizer produced.
      # Without that this step would be a job that cannot go red.
      - name: Test Locus API under ASan/UBSan
        run: make -C locus/api test-asan

  # ==========================================================================
  # Windows
  #
  # OTTO targets native Windows, but nothing here built on it until sh_pal.h.
  # This job is what stops that rotting: a PAL only ever compiled on Linux is
  # a PAL nobody notices breaking.
  #
  # Covers every core library: shared/, velo/, carta/, locus/ and ralph/.
  # The API servers are what remain; they additionally need Keel built here.
  #
  # The two Ralph out-of-process suites used to skip here, because
  # lp_external_oop_run() had no Windows implementation. It has one now
  # (CreateProcess over a pipe polled with PeekNamedPipe), and both suites run
  # on this job -- which is the point: the GLPK cross-validation path is how
  # solver changes get checked against a reference, and it was unavailable on
  # Windows entirely.
  # ==========================================================================
  windows:
    name: Windows Core
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 + UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-python
            jq

      - name: Build and run the PAL tests
        run: make -C shared test-pal

      - name: Build and test all of shared
        run: make -C shared test

      - name: Build and test Velo
        run: make -C velo test

      - name: Build and test Carta
        run: make -C carta test

      - name: Build and test Locus
        run: make -C locus test

      - name: Build and test Ralph
        run: make -C ralph test

      # Nexus did not compile on Windows at all until vendor/tre landed:
      # nx_validate.c and nx_xform.c both include <regex.h>, which is POSIX and
      # does not exist here. This is what stops that regressing.
      - name: Build and test Nexus
        run: make -C nexus test

      # test-lap is not part of `make -C ralph test` -- the Linux matrix runs it
      # as its own entry, and Windows never did. It belongs here more than
      # anywhere: three of its cases compare two timed arms, and this is the
      # platform with the coarsest clock. That gap was real. The suite measured
      # with clock(), whose tick is 15.6 ms here, so arms that run in about a
      # millisecond both read 0.000 ms and the ratios between them came out as
      # 0.00x and inf. It now measures with sh_monotonic_seconds() and scales
      # each benchmark until its baseline is worth dividing by.
      - name: Build and test Ralph LAP
        run: make -C ralph test-lap

      # The Linux matrix runs netflow, detect and netlib as their own entries;
      # Windows ran none of the three. netflow and detect already passed here --
      # 153 and 194 assertions that nobody was collecting. netlib could not run
      # at all: ralph-benchmark did not compile on Windows, because its NETLIB
      # harness forks a child per problem and <sys/wait.h> does not exist here.
      # That harness now has a Windows path, and this is what keeps it honest.
      - name: Build and test Ralph Netflow
        run: make -C ralph test-netflow

      - name: Build and test Ralph Detect
        run: make -C ralph test-detect

      - name: Build and test Ralph Netlib
        run: make -C ralph test-netlib

      # Benders, edge cases and optim ran on Linux and nowhere else. Not
      # because they fail here -- they pass, 42/42, all edge cases, and 20/20
      # -- but because no Windows job named them and nothing was asking.
      - name: Build and test Ralph Benders
        run: make -C ralph test-benders

      - name: Build and test Ralph Edge Cases
        run: make -C ralph test-edge

      - name: Build and test Ralph Optim
        run: make -C ralph test-optim

      # fuelwise and surge were missing here, and that is exactly why #63 shipped
      # a fuelwise link that had never been tried on Windows. Surge's own LDFLAGS
      # had the same hole, found the moment this step existed.
      #
      # The slow halves of both suites live in Windows Suites below; what stays
      # here is what gives fast feedback. FuelWise's unit suite is 2s and its
      # bench harness is a minute; Surge's transport test is instant and
      # test_surge is five minutes of actual solving.
      - name: Build and test FuelWise
        run: |
          make -C fuelwise test-transport
          make -C fuelwise test-unit

      - name: Build and test Surge
        run: make -C surge test-transport

      - name: Build the API servers
        run: |
          make -C ralph/api
          make -C fuelwise/api
          make -C surge/api
          make -C velo/api
          make -C carta/api
          make -C locus/api

      # bench_pbf is the PBF->.vlg builder and is not part of `make velo`.
      #
      # This duplicates the same step in Windows MSVC, which is why it was left
      # out for a while -- it looked like paying for the Monaco download twice
      # per run. Measured on the Windows MSVC job it is 6.2s end to end,
      # download and graph build included, so the duplication is cheaper than
      # any scheme for avoiding it.
      - name: Fetch Monaco fixtures
        run: |
          make data/monaco-latest.osm.pbf
          make -C velo bench_pbf
          make data/monaco.vlg

      # The servers were built but never exercised here: Windows MSVC runs
      # these six suites against MSVC binaries and macOS Core against clang
      # ones, so the MinGW binaries were the last ones nothing drove. They are
      # the binaries Windows Core itself produces, and the ones a Windows
      # contributor builds by hand, so "it links" was the weakest claim in the
      # matrix.
      #
      # Each script starts its own server, picks its own port and exits
      # non-zero on failure. Four run from the repo root and two from their own
      # directory; that split is the scripts' own convention.
      - name: Test the API servers
        run: |
          bash ralph/api/test_api.sh
          (cd surge/api && bash test_api.sh)
          (cd fuelwise/api && bash test_api.sh)
          bash velo/api/test_api.sh
          bash carta/api/test_api.sh
          bash locus/api/test_api.sh

  # ==========================================================================
  # macOS Core
  #
  # OTTO is developed on macOS, but CI only covered Linux and Windows -- a
  # macOS-specific break (Apple clang vs GCC, Homebrew libomp/glpk paths, BSD
  # vs GNU userland) could land unseen. This mirrors the Windows job: every
  # module's full suite plus a build of all six API servers.
  #
  # The Ralph and FuelWise Makefiles already select the macOS OpenMP flags
  # (-Xclang -fopenmp against Homebrew's libomp under /opt/homebrew, resolved
  # via `brew --prefix libomp`); macos-latest is Apple Silicon, so those paths
  # match. glpk supplies glpsol for FuelWise's MILP-objective regression.
  #
  # The six live-server curl e2e suites run here too, against clang-built
  # binaries. BSD userland is the reason this is not merely a copy of the
  # Windows step: carta's suite checked its PNG with `head -c 8 | grep PNG`,
  # which BSD grep rejects as binary because 0x89 is not valid UTF-8. It now
  # compares the signature bytes with od.
  # ==========================================================================
  macos:
    name: macOS Core
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install glpk libomp

      - name: Build and test all of shared
        run: make -C shared test

      - name: Build and test Ralph
        run: make -C ralph test

      - name: Build and test Velo
        run: make -C velo test

      - name: Build and test Carta
        run: make -C carta test

      - name: Build and test Locus
        run: make -C locus test

      - name: Build and test FuelWise
        run: make -C fuelwise test

      - name: Build and test Surge
        run: make -C surge test

      - name: Build and test Nexus
        run: make -C nexus test

      # `make api` rather than six copy-pasted lines; that aggregate target
      # exists now precisely because this block was duplicated here and in
      # Windows Core.
      - name: Build the API servers
        run: make api
      # The API e2e suites. macOS is the only platform where Keel's kqueue event
      # backend runs -- Linux takes epoll and Windows takes WSAPoll -- and until
      # now this job built the six servers and stopped, so kqueue was exercised
      # at runtime nowhere in CI. That is the reason these are here and not just
      # a wish for symmetry.
      #
      # bench_pbf is the PBF->.vlg builder and is not part of `make velo`.
      - name: Fetch Monaco fixtures
        run: |
          make data/monaco-latest.osm.pbf
          make -C velo bench_pbf
          make data/monaco.vlg

      # Each script starts its own server, picks its own port and exits non-zero
      # on failure. Four run from the repo root and two from their own
      # directory; that split is the scripts' own convention. None of them uses
      # a GNU-only tool, which is what makes this portable to BSD userland --
      # checked rather than assumed.
      - name: Test the API servers
        run: |
          bash ralph/api/test_api.sh
          (cd surge/api && bash test_api.sh)
          (cd fuelwise/api && bash test_api.sh)
          bash velo/api/test_api.sh
          bash carta/api/test_api.sh
          bash locus/api/test_api.sh

  # ==========================================================================
  # Windows Suites
  #
  # The two Windows suites that are slow enough to be worth waiting for
  # separately, so Windows Core stays fast feedback rather than a ten-minute
  # gate on every push.
  #
  # Where the time went, from the Windows Core run on #68 (620s total):
  #
  #   Build and test Surge          338s
  #   Build and test Ralph           66s
  #   Build and test FuelWise        65s
  #   Build the API servers          54s
  #   toolchain setup + checkout     49s
  #   everything else                48s
  #
  # Of that Surge step, test_surge is ~297s on its own -- it is the 18k-line
  # suite and it actually solves. The other four Surge binaries together run
  # in under 1.5s. Of the FuelWise step, the bench regression is most of it.
  #
  # So this split is not "move the slow-looking thing": it moves the two
  # measured costs, which takes Windows Core to roughly three minutes and lets
  # it drop the glpk package, since only the bench harness shells out to
  # glpsol.
  # ==========================================================================
  windows-suites:
    name: Windows Suites
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 + UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-glpk
            mingw-w64-ucrt-x86_64-python
            jq

      # The full Surge suite. Windows Core runs its transport test, which is
      # the invariant; this is the solver behaviour.
      - name: Build and test Surge
        run: make -C surge test

      # Linux-only until the runners had python3, which is the whole reason
      # this suite was moved out of the C test target in the first place.
      - name: Test Surge scripts
        run: make -C surge scripts-test

      # The FuelWise benchmark regression compares Ralph's MILP objectives
      # against glpsol. Running that on Windows checks Ralph's numerics under a
      # different libm and compiler, not merely that the code compiles.
      - name: Build and run the FuelWise bench regression
        run: make -C fuelwise test-bench

  # ==========================================================================
  # Windows Suites (MSVC)
  #
  # The same two suites as Windows Suites, under cl.exe. Both are numerical --
  # Surge's solver behaviour, and Ralph's MILP objectives compared against
  # glpsol -- and MSVC's libm and FP codegen are not MinGW's. A disagreement
  # between the two compilers is exactly the finding worth having, and it is
  # only visible if both actually run. Windows MSVC covers the transport
  # invariants under cl.exe; this covers the arithmetic.
  #
  # glpk comes from MSYS2 even though the compiler does not: glpsol is invoked
  # as a subprocess and never linked, so a MinGW-built glpsol is a fine oracle
  # for an MSVC-built caller.
  #
  # mingw32-make, not MSYS's make: /usr/bin/make strips TMPDIR/TMP/TEMP from the
  # environment, and cl.exe needs them for its intermediates.
  # ==========================================================================
  windows-suites-msvc:
    name: Windows Suites MSVC
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 (make, glpsol and jq; the compiler is MSVC)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-glpk
            mingw-w64-ucrt-x86_64-python
            jq

      - name: Report the toolchain
        run: |
          source scripts/msvc-env.sh
          cl 2>&1 | head -2
          glpsol --version | head -1
          jq --version

      - name: Build and test Surge
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C surge CC=cl test

      - name: Build and run the FuelWise bench regression
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C fuelwise CC=cl test-bench

  # ==========================================================================
  # Sanitizers
  #
  # A c-audit of the Phase 1 transport code found two heap overflows and an
  # out-of-bounds write in fresh memory-handling code. None were caught by the
  # compiler: those files were already clean under -Wall -Wextra -Wpedantic
  # -Wconversion -Wshadow -Wformat=2 -Wcast-align -Wnull-dereference, and still
  # are. Warning flags do not find that class of defect; ASan does, mechanically.
  #
  # Deliberately ungated and deliberately narrow. It targets the shared code
  # that async and streaming now run through, rather than every suite: Ralph's
  # full suite under -O0 + ASan would cost far more CI time for far less signal.
  # Widen it when a module's own memory handling starts changing.
  # ==========================================================================
  # Windows MSVC
  #
  # Every other Windows job here is MSYS2/MinGW. Until this existed, nothing in
  # CI ever ran cl.exe -- so "OTTO builds with MSVC" rested entirely on someone
  # running it by hand, and a contributor could break it without a single check
  # going red. mk/toolchain.mk carries the whole compiler difference; this is
  # what keeps it honest.
  #
  # The API servers are here too, since Keel v3.1.0 gave it a native MSVC build
  # path. Before that this job stopped at the libraries, and "OTTO builds the
  # servers with MSVC" was simply not true. The target list is Windows Core's
  # plus Arbor and ClayShards, so a divergence between the two compilers shows
  # up as one job red and the other green rather than as a mystery.
  #
  # mingw32-make, not MSYS's make: /usr/bin/make strips TMPDIR/TMP/TEMP from the
  # environment, and cl.exe needs them for its intermediates.
  # ==========================================================================
  # ==========================================================================
  # Windows MSVC ASan
  #
  # Every sanitizer job in this file is ubuntu-latest, so a memory error
  # reachable only through a Windows code path had nothing watching for it --
  # it had to crash a test outright to be noticed. MSVC has supported
  # /fsanitize=address since 16.9; mk/toolchain.mk now maps CC_SANITIZE to it,
  # so the existing test-asan targets work under CC=cl unchanged.
  #
  # Narrower than the Linux jobs on purpose: MSVC has no UndefinedBehaviour
  # and no Leak sanitizer, so this is address only and a UB finding stays
  # Linux-only work.
  #
  # shared plus the six servers: the servers because they are the only OTTO
  # code that reads bytes off a socket, and shared because they all sit on it.
  # ==========================================================================
  windows-msvc-asan:
    name: Windows MSVC ASan
    runs-on: windows-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 (make and coreutils only; the compiler is MSVC)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-python
            jq

      - name: Report the MSVC toolchain
        run: |
          source scripts/msvc-env.sh
          cl 2>&1 | head -2

      - name: Shared under ASan
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C shared CC=cl test-asan

      # The api test-asan targets instrument the server's own sources -- the
      # socket-facing ones -- and link the module library built normally,
      # which is the same shape the Linux jobs use. The libraries have to
      # exist first; on Linux an earlier step in the same job has already
      # built them.
      # Plain `lib`. The step above is `shared test-asan`, which rebuilds
      # libshared.a with the sanitizer -- and this step used to need an
      # explicit `clean` first, because make called that archive current and
      # every server linked it. mk/flagstamp.mk now discards objects built
      # with different flags, so the clean is redundant. Verified by removing
      # it: this job is what proves the stamp works.
      - name: Build the module libraries
        run: |
          source scripts/msvc-env.sh
          for m in shared ralph arbor surge fuelwise velo locus carta; do
            mingw32-make -C $m CC=cl lib
          done

      # Mirrors the Fetch Monaco fixtures step in windows-msvc, including its
      # reason: the .vlg builder is bench_pbf, which is not part of `make velo`
      # and would otherwise be built by the default compiler -- gcc, which this
      # runner does not install. Writing this step from scratch rather than
      # copying that one cost a red run whose failure was a missing compiler.
      - name: Fetch Monaco fixtures
        run: |
          source scripts/msvc-env.sh
          mingw32-make data/monaco-latest.osm.pbf
          mingw32-make -C velo bench_pbf CC=cl
          mingw32-make data/monaco.vlg CC=cl

      # Built and run in separate steps, because the two halves need
      # opposite environments and `test-asan` does both at once.
      #
      # cl needs scripts/msvc-env.sh, which exports MSYS2_ARG_CONV_EXCL='*'
      # so /Fo: and /std:c11 reach the compiler as flags rather than being
      # rewritten as paths. But with conversion off, the `curl -o /tmp/...`
      # these suites use reaches native curl as a literal path it cannot
      # write -- which is why windows-suites-msvc deliberately does not
      # source it. Sourcing it for the whole of test-asan cost a red run:
      # carta reported 18/19 with `PNG tile has a PNG signature` failing,
      # not because the PNG was wrong but because curl never wrote the file.
      #
      # `build-asan` is the build half of `test-asan` -- same DEBUG_CFLAGS,
      # same DEBUG_LDFLAGS, no test run. Three of the six api Makefiles had a
      # `debug` target and three did not, so the job now calls one name that
      # all six define.
      - name: Build the six servers with ASan
        run: |
          source scripts/msvc-env.sh
          for m in ralph surge fuelwise velo locus carta; do
            mingw32-make -C $m/api CC=cl build-asan
          done

      # No msvc-env here, for the reason above. Nothing compiles: the
      # binaries exist. Four suites run from the repo root and two from
      # their own directory; that split is the scripts' own convention.
      #
      # Each script greps the server log and fails on anything a sanitizer
      # printed, so an ASan report on the server's stderr fails the suite
      # rather than passing unnoticed.
      - name: Run the six API suites under ASan
        run: |
          # msvc-env is sourced for PATH alone: the instrumented binaries link
          # clang_rt.asan_dynamic-x86_64.dll, which lives in the MSVC toolchain
          # directory and is otherwise not found -- the servers exit at startup
          # with "error while loading shared libraries".
          #
          # Then the two variables that suppress MSYS path conversion are
          # unset, because with them set the `curl -o /tmp/...` these suites
          # use reaches native curl as a path it cannot write. The compiler
          # needs them; curl must not have them.
          source scripts/msvc-env.sh
          unset MSYS_NO_PATHCONV MSYS2_ARG_CONV_EXCL
          bash ralph/api/test_api.sh
          (cd surge/api && bash test_api.sh)
          (cd fuelwise/api && bash test_api.sh)
          bash velo/api/test_api.sh
          bash carta/api/test_api.sh
          bash locus/api/test_api.sh
  windows-msvc:
    name: Windows MSVC
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 (make and coreutils only; the compiler is MSVC)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-python
            jq

      - name: Report the MSVC toolchain
        run: |
          source scripts/msvc-env.sh
          cl 2>&1 | head -2
          echo "cl:   $(command -v cl)"
          echo "link: $(command -v link)"
          echo "lib:  $(command -v lib)"

      - name: Build and run the PAL tests
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C shared CC=cl test-pal

      - name: Build and test all of shared
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C shared CC=cl test

      - name: Build and test Velo
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C velo CC=cl test

      - name: Build and test Carta
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C carta CC=cl test

      - name: Build and test Locus
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C locus CC=cl test

      - name: Build and test Ralph
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C ralph CC=cl test

      - name: Build and test Ralph LAP
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C ralph CC=cl test-lap

      - name: Build and test Ralph Netflow
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C ralph CC=cl test-netflow

      - name: Build and test Ralph Detect
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C ralph CC=cl test-detect

      - name: Build and test Ralph Netlib
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C ralph CC=cl test-netlib

      - name: Build and test Arbor
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C arbor CC=cl test

      - name: Build and test Nexus
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C nexus CC=cl test

      - name: Build and test FuelWise
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C fuelwise CC=cl test-transport
          mingw32-make -C fuelwise CC=cl test-unit

      - name: Build and test Surge
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C surge CC=cl test-transport

      # ClayShards. The whole native stack reaches the terminal through
      # sh_pal.h -- is-stdout-a-tty, terminal size, raw mode, input bytes --
      # rather than termios/ioctl/signal, which is what lets it build here.
      # The tty demo is exercised headless: it renders frames to stdout with
      # no terminal involved, so it is the one part of a TUI that CI can
      # actually check.
      - name: Build and test ClayShards
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C clayshards/clay-shards CC=cl test
          mingw32-make -C clayshards/clay-shards-soft CC=cl test
          mingw32-make -C clayshards/clay-shards-tui CC=cl test
          mingw32-make -C clayshards/demos/tty CC=cl all
          ./clayshards/demos/tty/build/demo_tui_tty.exe --headless > /dev/null
          mingw32-make -C clayshards/clay-shards-soft CC=cl demo DEMO_ARGS="--frames 3"

      # The six API servers, the last thing MSVC could not build. They need
      # Keel, which grew a native MSVC path in v3.1.0; before that this job
      # stopped at the libraries. Build only here, matching Windows Core --
      # the live-server curl suites are a bigger CI surface than this job needs.
      - name: Build the API servers
        run: |
          source scripts/msvc-env.sh
          mingw32-make -C ralph/api CC=cl
          mingw32-make -C fuelwise/api CC=cl
          mingw32-make -C surge/api CC=cl
          mingw32-make -C velo/api CC=cl
          mingw32-make -C carta/api CC=cl
          mingw32-make -C locus/api CC=cl

      # The point of a native MSVC build is a binary with no MinGW runtime
      # underneath it. Keel asserts this for itself with check-msvc-no-mingw;
      # this is the same assertion for OTTO's servers. Without it the job would
      # still pass if a MinGW-built archive crept onto a link line.
      - name: Assert no MinGW runtime in the server binaries
        run: |
          source scripts/msvc-env.sh
          status=0
          for b in ralph/api/ralph-solver-server.exe \
                   fuelwise/api/fuelwise-api.exe \
                   surge/api/surge-solver.exe \
                   velo/api/velo-route-server.exe \
                   carta/api/carta-tile-server.exe \
                   locus/api/locus-geocoder.exe; do
            if [ ! -f "$b" ]; then echo "missing: $b"; status=1; continue; fi
            imports=$(dumpbin /nologo /dependents "$b" | grep -oiE '[A-Za-z0-9_.-]+\.dll' | sort -u | tr '\n' ' ')
            echo "$b: $imports"
            if echo "$imports" | grep -qiE 'libgcc|libwinpthread|libstdc|libgomp|msys-'; then
              echo "  ERROR: MinGW runtime import in $b"
              status=1
            fi
          done
          exit $status

      # The API e2e suites, which until now ran on no Windows job under either
      # compiler -- Windows Core and macOS Core build the six servers and stop.
      # They run here rather than in Windows Core because this is the job that
      # only just gained the server builds, so running them closes that loop
      # end to end. The suites are cheap: 110 assertions across the six, about
      # 25 seconds total. The fixtures cost more than the tests do.
      #
      # bench_pbf is the PBF->.vlg builder and is not part of `make velo`. Every
      # command here carries CC=cl, including the .vlg one: that target has an
      # order-only prerequisite on `velo`, so without it make would build the
      # velo module with gcc -- which this job does not install. That is also
      # why it must not be left to the default: the failure would be a missing
      # compiler, not a wrong one.
      - name: Fetch Monaco fixtures
        run: |
          source scripts/msvc-env.sh
          mingw32-make data/monaco-latest.osm.pbf
          mingw32-make -C velo bench_pbf CC=cl
          mingw32-make data/monaco.vlg CC=cl

      # Each script starts its own server, picks its own port and exits
      # non-zero on failure. Four run from the repo root and two from their own
      # directory; that split is the scripts' own convention, not this job's.
      #
      # Deliberately does NOT source scripts/msvc-env.sh. Nothing here compiles
      # -- the binaries already exist -- and that script exports
      # MSYS2_ARG_CONV_EXCL='*' so MSYS stops rewriting /Fo and /std:c11 for
      # cl.exe. With conversion off, the `curl -s -o /dev/null` these suites use
      # everywhere reaches Windows curl as a literal path it cannot write, and
      # curl exits 23 mid-suite. Sourcing it here fails surge, fuelwise and
      # carta; not sourcing it passes all six.
      - name: Test the API servers
        run: |
          bash ralph/api/test_api.sh
          (cd surge/api && bash test_api.sh)
          (cd fuelwise/api && bash test_api.sh)
          bash velo/api/test_api.sh
          bash carta/api/test_api.sh
          bash locus/api/test_api.sh

  # ==========================================================================
  sanitizers:
    name: Sanitize ${{ matrix.suite.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: Shared
            target: test-asan
            dir: shared
          - name: Ralph Transport
            target: test-transport-asan
            dir: ralph
          - name: Arbor
            target: test-asan
            dir: arbor

    env:
      # UBSan only prints and keeps going by default, so a finding would not
      # fail the job. halt_on_error makes it fatal, which is the point.
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Sanitize ${{ matrix.suite.name }}
        run: make -C ${{ matrix.suite.dir }} ${{ matrix.suite.target }}

  # ==========================================================================
  # Test coverage of the test suite itself
  #
  # Not "how much code is covered" -- whether anything runs the tests that are
  # in the tree. The same defect kept recurring: a test file compiling, passing
  # and named by no target anything invokes. It hid an invalid MPS writer
  # (`make test` without test_lp), a broken MSVC link and an unsanitised PDF
  # parser (`shared/test` without test_pdf2struc), and 135 passing assertions
  # in ralph. Every time, the suite reported all green, because what it did not
  # run it also did not count.
  #
  # Cheap to check and cheap to keep true, which is the argument for doing it
  # in CI rather than by audit every few months.
  # ==========================================================================
  test-coverage:
    name: Every Test Is Run
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Check that every test program is reached on every platform
        run: python3 scripts/check_test_coverage.py

  # ==========================================================================
  # The CLAUDE.md files are instructions, and nothing compiles them, so they
  # rot silently while still giving confident directions. When this was added
  # they named a feature-class table of four values that were never in the
  # enum, an "add an endpoint" guide written against a webserver replaced two
  # migrations ago, and half a dozen functions under names they do not have.
  #
  # Widened afterwards to docs/ -- the MANIFESTO's central example was also
  # labelled Keel and written in Mongoose, and the ralph internals named a
  # dozen entry points without the _core_ they have carried since. Archive,
  # roadmaps and business are excluded on principle: they are supposed to name
  # things that do not exist yet, or no longer do.
  #
  # Names were not enough. Twice a correction to a name left behind a call that
  # could not compile -- sh_arena_create(&arena, buffer, size) against a
  # function taking a capacity, and cs_tui_render_clay_commands(r, commands)
  # against one taking three arguments. Argument counts are checked too.
  # ==========================================================================
  doc-symbols:
    name: Docs Name Real Things
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check that documents name real things and call them correctly
        run: python3 scripts/check_doc_symbols.py

  # ==========================================================================
  # Fuzzing (bounded)
  #
  # OTTO already had fuzz targets in carta, nexus and surge before this job
  # existed, and nothing ran any of them. A fuzzer nobody runs finds what
  # someone remembers to look for, which is the same as no fuzzer -- and the
  # two defects the PDF extractor gave up under manual reading were both
  # reachable from files under 500 bytes, well inside what a fuzzer reaches in
  # seconds.
  #
  # Deliberately short. This is a smoke run over committed seed corpora, to
  # keep the harnesses building and catch the shallow regressions on every
  # push; it is not a fuzzing campaign and will not find deep bugs. A longer
  # scheduled run is the obvious follow-up.
  #
  # libFuzzer needs clang, and the harnesses do not build under either Windows
  # clang -- the MinGW target has no -fsanitize=fuzzer, and the MSVC target
  # lacks the POSIX spellings shared/ uses. Linux is where this runs.
  # ==========================================================================
  fuzz-smoke:
    name: Fuzz Smoke (shared)
    runs-on: ubuntu-latest

    env:
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      ASAN_OPTIONS: abort_on_error=1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang

      - name: Report the toolchain
        run: clang --version | head -2

      # 20s each over the seeds. The corpora carry the two crafted PDFs that
      # exercised the predictor and the negative /W, so a regression in either
      # is caught on the first execution rather than by chance.
      - name: Fuzz sh_inflate, sh_protobuf and sh_pdf2struc
        run: make -C shared fuzz-smoke FUZZ_SMOKE_SECONDS=20

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            shared/crash-*
            shared/leak-*
            shared/timeout-*
          retention-days: 14
          if-no-files-found: ignore

  # ==========================================================================
  # Fuzzing the module parsers (bounded)
  #
  # carta, nexus and surge all shipped fuzz harnesses, and none of them had
  # ever run. They were not merely unscheduled -- they did not work:
  #
  #   * carta and nexus archived $(OBJS), which is src/*.o, but compiled with
  #     `-c` and no `-o`, which writes to the current directory. The archive
  #     therefore picked up whatever objects an ordinary build had left in
  #     src/, un-instrumented, so the fuzzer ran with no coverage feedback
  #     over the library it was supposed to be fuzzing.
  #   * nexus passed -Wl,-ld_classic unconditionally. That is a macOS flag;
  #     on Linux, the only place these can run in CI, GNU ld reads it as
  #     "link the library d_classic" and the link fails.
  #   * carta had no seed corpus directory at all, while its own help text
  #     told you to point it at one.
  #
  # All three are fixed in the same commit as this job. The job exists so the
  # next regression is caught by CI rather than by someone deciding to try the
  # harnesses two years later.
  #
  # Split by module so a slow one does not gate the others, and because the
  # fuzz builds rebuild ../shared with sanitizer flags in place -- they are
  # destructive to a shared workspace and want a checkout each.
  # ==========================================================================
  fuzz-smoke-modules:
    name: Fuzz Smoke (${{ matrix.module }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # ralph and fuelwise joined when their *_api_handle() harnesses were
        # added; they had no fuzz target before that. velo and locus joined
        # the same way, and carta gained a second harness alongside its PBF
        # one -- its fuzz-smoke now runs both.
        module: [carta, nexus, surge, ralph, fuelwise, velo, locus]

    env:
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      ASAN_OPTIONS: abort_on_error=1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang

      - name: Report the toolchain
        run: clang --version | head -2

      - name: Fuzz ${{ matrix.module }}
        run: make -C ${{ matrix.module }} fuzz-smoke FUZZ_SMOKE_SECONDS=20

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.module }}
          path: |
            ${{ matrix.module }}/crash-*
            ${{ matrix.module }}/leak-*
            ${{ matrix.module }}/timeout-*
          retention-days: 14
          if-no-files-found: ignore

  # API docs
  #
  # site/api.html is generated from the /*@api ... */ annotations in the module
  # headers and is a committed file, so it rots silently the moment a header
  # changes without a regen. `--check` regenerates the HTML from the current
  # headers in memory and diffs it against what is committed, so it fails
  # exactly when the two have parted company. CLAUDE.md has described this target as "for CI" for a
  # long time while no workflow ran it, and the cost of that was two bugs at
  # once: the generator could not run on Windows at all (Python defaults to the
  # locale codepage there, so reading UTF-8 sources and printing check marks both
  # raised), and api.html had drifted out of date -- it documented "gallons" and
  # "price_per_gallon" where fuelwise's headers now say "purchase" and "price".
  #
  # Windows is in the matrix for exactly that reason. A Linux-only job would not
  # have caught the half of this that mattered.
  #
  # The target takes no build: it reads headers and a template, so there is no
  # Emscripten or C toolchain here despite api.html's WASM demos.
  # ==========================================================================
  api-docs:
    name: API Docs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: windows-latest
            python: python

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check api.html is up-to-date with the headers
        run: ${{ matrix.python }} scripts/build-api-docs.py --check

  # ==========================================================================
  # ==========================================================================
  # Build WebAssembly
  # ==========================================================================
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    # Deliberately ungated. This is a build, not a test: it takes a fresh
    # checkout, installs its own toolchain and runs `make wasm`, sharing no
    # artifacts with test-c. Gating it behind the suites meant an unrelated
    # test failure hid whether the WASM build itself still worked -- the same
    # reason build-docker stopped depending on test-c. Now that test-c is a
    # matrix, a `needs:` could not name individual suites anyway; it would
    # block on all ten.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.51'

      - name: Build all WASM modules
        run: make wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: |
            fuelwise/wasm/build/
            velo/wasm/build/
            carta/wasm/build/
            locus/wasm/build/
            ralph/wasm/build/
          retention-days: 7

  # ==========================================================================
  # Build Docker images (skipped by default, runs on tags or manual trigger)
  # ==========================================================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    # Gate on the jobs that actually exercise the servers being packaged.
    # This used to be `needs: test-c`, which is a sequential job covering
    # every C library -- so an unrelated failure there meant a release tag
    # produced no images at all.
    needs: [test-surge, test-ralph-api, test-fuelwise-api, test-velo-api, test-carta-api, test-locus-api]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_docker == 'true'

    strategy:
      # One broken image should not hide the state of the others.
      fail-fast: false
      matrix:
        service:
          - name: fuelwise
            dockerfile: docker/Dockerfile.fuelwise
            context: .
            target: ""
          - name: carta
            dockerfile: docker/Dockerfile.carta
            context: .
            target: ""
          - name: velo
            dockerfile: docker/Dockerfile.velo
            context: .
            target: ""
          - name: locus
            dockerfile: docker/Dockerfile.locus
            context: .
            target: ""
          - name: ralph
            dockerfile: docker/Dockerfile.ralph
            context: .
            target: ""
          - name: data-builder
            dockerfile: docker/Dockerfile.data-builder
            context: .
            target: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          target: ${{ matrix.service.target || '' }}
          push: false
          tags: ${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
