name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']  # Run Docker builds on version tags
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      build_docker:
        description: 'Build Docker images'
        required: false
        default: false
        type: boolean

jobs:
  # ==========================================================================
  # Build and test C libraries -- one job per suite.
  #
  # This was a single sequential job, so it stopped at the first failing suite.
  # FuelWise was red for months and everything ordered after it -- Velo, Carta,
  # Locus -- simply never ran in that time; when the FuelWise bug was finally
  # fixed there was no way to know whether anything behind it had rotted. With
  # `fail-fast: false`, a red run now names every broken suite instead of just
  # the first.
  #
  # The old job also ran the Ralph sub-suites twice: root `make test-ralph`
  # already chains test-lap, test-netflow, test-netlib and test-detect, and the
  # job then re-ran three of them as separate steps. They are split out here as
  # their own suites and invoked directly, so each is reported once.
  #
  # Every suite's build target is self-sufficient: ralph, velo, carta and locus
  # each have a rule that builds ../shared/libshared.a on demand, so no job
  # depends on an earlier one having run.
  # ==========================================================================
  test-c:
    name: Test ${{ matrix.suite.name }}
    runs-on: ubuntu-latest

    strategy:
      # One broken suite should not hide the state of the others.
      fail-fast: false
      matrix:
        suite:
          - name: Shared
            build: make shared
            test: make test-shared
          - name: Ralph
            build: make ralph
            test: make -C ralph test
          - name: Ralph LAP
            build: make ralph
            test: make -C ralph test-lap
          - name: Ralph Netflow
            build: make ralph
            test: make -C ralph test-netflow
          - name: Ralph Netlib
            build: make ralph
            test: make -C ralph test-netlib
          - name: Ralph Detect
            build: make ralph
            test: make -C ralph test-detect
          - name: FuelWise
            build: make fuelwise
            test: make test-fuelwise
          - name: Velo
            build: make velo
            test: make test-velo
          - name: Carta
            build: make carta
            test: make test-carta
          - name: Locus
            build: make locus
            test: make test-locus

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev glpk-utils

      - name: Build ${{ matrix.suite.name }}
        run: ${{ matrix.suite.build }}

      - name: Test ${{ matrix.suite.name }}
        run: ${{ matrix.suite.test }}

  # ==========================================================================
  # Arbor + Surge (Keel-backed API)
  #
  # Deliberately a standalone job with no `needs:`. These ran nowhere before,
  # and folding them into test-c would mean an unrelated failure earlier in
  # that sequential job silently skips them.
  # ==========================================================================
  test-surge:
    name: Test Arbor + Surge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build and test Arbor
        run: |
          make arbor
          make test-arbor

      - name: Build and test Surge
        run: |
          make surge
          make test-surge

      # Surge API is served by Keel (vendor/keel submodule), not mongoose
      - name: Build Surge API
        run: |
          make surge-api
          ./surge/api/surge-solver --help > /dev/null

      # Actually start the server and exercise the endpoints. Building and
      # --help never start it, which is how a startup crash stayed green.
      - name: Test Surge API
        timeout-minutes: 5
        run: cd surge/api && bash test_api.sh



  # ==========================================================================
  # Ralph API (Keel-backed)
  #
  # Standalone for the same reason as test-surge: this lived in test-api,
  # which is gated behind test-c, so an unrelated failure there skipped it.
  # ==========================================================================
  test-ralph-api:
    name: Test Ralph API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build Ralph API
        run: |
          make ralph-api
          ./ralph/api/ralph-solver-server --help > /dev/null

      - name: Test Ralph API
        timeout-minutes: 5
        run: bash ralph/api/test_api.sh

  # ==========================================================================
  # FuelWise API (Keel-backed)
  #
  # Standalone for the same reason as test-surge / test-ralph-api: this
  # lived in test-api, which is gated behind test-c, so an unrelated
  # failure there skipped it. test_api.sh exits non-zero on failure, so
  # unlike the Ralph target this one is a real gate.
  # ==========================================================================
  test-fuelwise-api:
    name: Test FuelWise API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build FuelWise API
        run: |
          make -C fuelwise/api
          ./fuelwise/api/fuelwise-api --help > /dev/null

      - name: Test FuelWise API
        run: make -C fuelwise/api test




  # ==========================================================================
  # Velo API (Keel-backed)
  #
  # Standalone, and unlike the old build-only step this actually starts the
  # server and issues routes. Velo needs an OSM graph, so the job builds one
  # from Monaco (~700KB, the Makefile already fetches it).
  # ==========================================================================
  test-velo-api:
    name: Test Velo API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build Velo API
        run: |
          make velo-api
          ./velo/api/velo-route-server --help > /dev/null

      # bench_pbf is the PBF->.vlg builder; it is not part of `make velo`.
      - name: Build Monaco graph
        run: |
          make -C velo bench_pbf
          make data/monaco.vlg

      - name: Test Velo API
        timeout-minutes: 5
        run: bash velo/api/test_api.sh

  # ==========================================================================
  # Carta API (Keel-backed)
  #
  # Standalone, and it starts the server and renders real tiles. Carta needs
  # an OSM PBF, so the job uses Monaco (~700KB, fetched by the Makefile).
  # ==========================================================================
  test-carta-api:
    name: Test Carta API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build Carta API
        run: |
          make carta-api
          ./carta/api/carta-tile-server --help > /dev/null

      - name: Fetch Monaco PBF
        run: make data/monaco-latest.osm.pbf

      - name: Test Carta API
        timeout-minutes: 5
        run: bash carta/api/test_api.sh

  # ==========================================================================
  # Locus API (Keel-backed)
  #
  # Standalone, and it starts the server and issues real geocode queries.
  # Locus needs an OSM PBF, so the job uses Monaco (fetched by the Makefile).
  # ==========================================================================
  test-locus-api:
    name: Test Locus API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build Locus API
        run: |
          make locus-api
          ./locus/api/locus-geocoder --help > /dev/null

      - name: Fetch Monaco PBF
        run: make data/monaco-latest.osm.pbf

      - name: Test Locus API
        timeout-minutes: 5
        run: bash locus/api/test_api.sh

  # ==========================================================================
  # Build WebAssembly
  # ==========================================================================
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    # Deliberately ungated. This is a build, not a test: it takes a fresh
    # checkout, installs its own toolchain and runs `make wasm`, sharing no
    # artifacts with test-c. Gating it behind the suites meant an unrelated
    # test failure hid whether the WASM build itself still worked -- the same
    # reason build-docker stopped depending on test-c. Now that test-c is a
    # matrix, a `needs:` could not name individual suites anyway; it would
    # block on all ten.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.51'

      - name: Build all WASM modules
        run: make wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: |
            fuelwise/wasm/build/
            velo/wasm/build/
            carta/wasm/build/
            locus/wasm/build/
            ralph/wasm/build/
          retention-days: 7

  # ==========================================================================
  # Build Docker images (skipped by default, runs on tags or manual trigger)
  # ==========================================================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    # Gate on the jobs that actually exercise the servers being packaged.
    # This used to be `needs: test-c`, which is a sequential job covering
    # every C library -- so an unrelated failure there meant a release tag
    # produced no images at all.
    needs: [test-surge, test-ralph-api, test-fuelwise-api, test-velo-api, test-carta-api, test-locus-api]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_docker == 'true'

    strategy:
      # One broken image should not hide the state of the others.
      fail-fast: false
      matrix:
        service:
          - name: fuelwise
            dockerfile: docker/Dockerfile.fuelwise
            context: .
            target: ""
          - name: carta
            dockerfile: docker/Dockerfile.carta
            context: .
            target: ""
          - name: velo
            dockerfile: docker/Dockerfile.velo
            context: .
            target: ""
          - name: locus
            dockerfile: docker/Dockerfile.locus
            context: .
            target: ""
          - name: ralph
            dockerfile: docker/Dockerfile.ralph
            context: .
            target: ""
          - name: data-builder
            dockerfile: docker/Dockerfile.data-builder
            context: .
            target: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          target: ${{ matrix.service.target || '' }}
          push: false
          tags: ${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
