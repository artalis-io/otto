name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']  # Run Docker builds on version tags
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      build_docker:
        description: 'Build Docker images'
        required: false
        default: false
        type: boolean

jobs:
  # ==========================================================================
  # Build and test C libraries
  # ==========================================================================
  test-c:
    name: Test C Libraries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev glpk-utils

      - name: Build and test Shared
        run: |
          make shared
          make test-shared

      - name: Build and test Ralph
        run: |
          make ralph
          make test-ralph

      - name: Test Ralph LAP
        run: make -C ralph test-lap

      - name: Test Ralph Netflow
        run: make -C ralph test-netflow

      - name: Test Ralph Detect
        run: make -C ralph test-detect

      - name: Build and test FuelWise
        run: |
          make fuelwise
          make test-fuelwise

      - name: Build and test Velo
        run: |
          make velo
          make test-velo

      - name: Build and test Carta
        run: |
          make carta
          make test-carta

      - name: Build and test Locus
        run: |
          make locus
          make test-locus

  # ==========================================================================
  # Arbor + Surge (Keel-backed API)
  #
  # Deliberately a standalone job with no `needs:`. These ran nowhere before,
  # and folding them into test-c would mean an unrelated failure earlier in
  # that sequential job silently skips them.
  # ==========================================================================
  test-surge:
    name: Test Arbor + Surge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build and test Arbor
        run: |
          make arbor
          make test-arbor

      - name: Build and test Surge
        run: |
          make surge
          make test-surge

      # Surge API is served by Keel (vendor/keel submodule), not mongoose
      - name: Build Surge API
        run: |
          make surge-api
          ./surge/api/surge-solver --help > /dev/null

  # ==========================================================================
  # Ralph API (Keel-backed)
  #
  # Standalone for the same reason as test-surge: this lived in test-api,
  # which is gated behind test-c, so an unrelated failure there skipped it.
  # ==========================================================================
  test-ralph-api:
    name: Test Ralph API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build Ralph API
        run: |
          make ralph-api
          ./ralph/api/ralph-solver-server --help > /dev/null

      # NOTE: this target reports PASS/FAIL but always exits 0, so it cannot
      # fail the build. See docs/roadmaps/ralph.md (Keel Migration) before
      # relying on it as a gate.
      - name: Test Ralph API
        run: make -C ralph/api test

  # ==========================================================================
  # FuelWise API (Keel-backed)
  #
  # Standalone for the same reason as test-surge / test-ralph-api: this
  # lived in test-api, which is gated behind test-c, so an unrelated
  # failure there skipped it. test_api.sh exits non-zero on failure, so
  # unlike the Ralph target this one is a real gate.
  # ==========================================================================
  test-fuelwise-api:
    name: Test FuelWise API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      # NOTE: no --help smoke here. fuelwise-api exits 1 on --help (it treats
      # sh_args_parse's help return as an error); see docs/roadmaps/fuelwise.md.
      - name: Build FuelWise API
        run: make -C fuelwise/api

      - name: Test FuelWise API
        run: make -C fuelwise/api test

  # TEMPORARY diagnostic: does Keel rc.3 async work on Linux, using Keel's
  # OWN unmodified example? Remove once answered.
  keel-async-probe:
    name: Keel async probe (temporary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Keel + example
        run: |
          make -C vendor/keel
          make -C vendor/keel examples
      - name: Probe sync vs async
        run: |
          ./vendor/keel/examples/async_thread_pool &
          sleep 2
          echo "--- sync route / ---"
          curl -s -m 10 -o /dev/null -w "sync:  code=%{http_code} time=%{time_total}
" http://127.0.0.1:8080/ || echo "sync FAILED"
          echo "--- async route /fast ---"
          curl -s -m 10 -o /dev/null -w "async: code=%{http_code} time=%{time_total}
" http://127.0.0.1:8080/fast || echo "async FAILED (timeout)"
          echo "--- async route /slow ---"
          curl -s -m 10 -o /dev/null -w "async: code=%{http_code} time=%{time_total}
" http://127.0.0.1:8080/slow || echo "async FAILED (timeout)"

  # ==========================================================================
  # Build and test API servers
  # ==========================================================================
  test-api:
    name: Test API Servers
    runs-on: ubuntu-latest
    needs: test-c

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      # APIs that need OSM data - just verify they build and show help
      - name: Build Carta API
        run: |
          make carta-api
          ./carta/api/carta-tile-server --help > /dev/null

      - name: Build Velo API
        run: |
          make velo-api
          ./velo/api/velo-route-server --help > /dev/null

      - name: Build Locus API
        run: |
          make locus-api
          ./locus/api/locus-geocoder --help > /dev/null

  # ==========================================================================
  # Build WebAssembly
  # ==========================================================================
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    needs: test-c

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.51'

      - name: Build all WASM modules
        run: make wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: |
            fuelwise/wasm/build/
            velo/wasm/build/
            carta/wasm/build/
            locus/wasm/build/
            ralph/wasm/build/
          retention-days: 7

  # ==========================================================================
  # Build Docker images (skipped by default, runs on tags or manual trigger)
  # ==========================================================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test-c
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_docker == 'true'

    strategy:
      matrix:
        service:
          - name: fuelwise
            dockerfile: Dockerfile
            context: .
            target: runtime
          - name: fuelwise-api
            dockerfile: Dockerfile
            context: .
            target: api-only
          - name: carta
            dockerfile: docker/Dockerfile.carta
            context: .
            target: ""
          - name: velo
            dockerfile: docker/Dockerfile.velo
            context: .
            target: ""
          - name: locus
            dockerfile: docker/Dockerfile.locus
            context: .
            target: ""
          - name: ralph
            dockerfile: docker/Dockerfile.ralph
            context: .
            target: ""
          - name: data-builder
            dockerfile: docker/Dockerfile.data-builder
            context: .
            target: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          target: ${{ matrix.service.target || '' }}
          push: false
          tags: ${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
