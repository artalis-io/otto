name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ==========================================================================
  # Build and test C libraries
  # ==========================================================================
  test-c:
    name: Test C Libraries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build and test Ralph
        run: |
          make ralph
          make test-ralph

      - name: Test Ralph LAP
        run: make -C ralph test-lap

      - name: Build and test Shared
        run: |
          make shared
          make test-shared

      - name: Build and test FuelWise
        run: |
          make fuelwise
          make test-fuelwise

      - name: Build and test Velo
        run: |
          make velo
          make test-velo

      - name: Build and test Carta
        run: |
          make carta
          make test-carta

  # ==========================================================================
  # Build and test API servers
  # ==========================================================================
  test-api:
    name: Test API Servers
    runs-on: ubuntu-latest
    needs: test-c

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Build FuelWise API
        run: make fuelwise-api

      - name: Test FuelWise API endpoints
        run: |
          # Start API server in background
          ./fuelwise/api/fuelwise-api -p 8080 &
          API_PID=$!
          sleep 2

          # Test health endpoint
          curl -sf http://localhost:8080/api/v1/health | grep -q '"status":"ok"'

          # Test solve endpoint
          curl -sf -X POST http://localhost:8080/api/v1/solve \
            -H "Content-Type: application/json" \
            -d '{"total_distance":500,"tank_capacity":100,"current_fuel":30,"consumption_mpg":8,"minimum_fuel":10,"stations":[{"id":1,"distance":100,"price":3.50},{"id":2,"distance":300,"price":3.25}]}' \
            | grep -q '"status":"optimal"'

          # Cleanup
          kill $API_PID

  # ==========================================================================
  # Build and test FuelWise UI
  # ==========================================================================
  test-fuelwise-ui:
    name: Test FuelWise UI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fuelwise/ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fuelwise/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fuelwise-ui-dist
          path: fuelwise/ui/dist/
          retention-days: 7

  # ==========================================================================
  # Build and test Carta UI
  # ==========================================================================
  test-carta-ui:
    name: Test Carta UI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: carta/ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: carta/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: carta-ui-dist
          path: carta/ui/dist/
          retention-days: 7

  # ==========================================================================
  # Build WebAssembly (optional)
  # ==========================================================================
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    needs: test-c

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.51'

      - name: Build all WASM modules
        run: make wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: |
            fuelwise/wasm/build/
            velo/wasm/build/
            carta/wasm/build/
          retention-days: 7

  # ==========================================================================
  # Build Docker image
  # ==========================================================================
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test-c, test-fuelwise-ui]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: false
          tags: fuelwise:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build API-only image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: api-only
          push: false
          tags: fuelwise-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
