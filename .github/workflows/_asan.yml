name: _asan repro (temporary)

# TEMPORARY. Delete before merge.
#
# Ralph segfaults on capacitated facility location. Reproduced on pristine main
# at 6 facilities x 14 customers, crashing around trial 22 of 40 varied
# instances. Stack on Windows:
#
#   bb_node_pool_copy <- compute_branch_children <- mip_solve
#
# Two hypotheses were tested locally and both were wrong: the free list never
# overflowed and no node was returned twice. So this is something else, and
# guessing further is a waste -- ASan names it in one run. Windows/MinGW ASan
# is unreliable, hence Linux.

on:
  push:
    branches:
      - fix/8d84b5bb-bb-node-pool

permissions:
  contents: read

jobs:
  asan:
    name: ASan on the CFL repro
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      # Sanitizers need the whole thing built with them, so the libraries are
      # rebuilt rather than reusing a normal build.
      - name: Build shared and ralph with ASan + UBSan
        run: |
          make -C shared clean
          make -C ralph clean
          make -C shared CC_OPT="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined"
          make -C ralph libralph.a CC_OPT="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined"

      - name: Build and run the repro under ASan
        run: |
          gcc -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined \
            -I ralph/include -I shared/include \
            ralph/tests/_repro_cfl.c \
            ralph/libralph.a shared/libshared.a \
            -lm -fopenmp -o /tmp/repro_cfl
          export ASAN_OPTIONS=abort_on_error=0:detect_leaks=0:print_stacktrace=1
          export UBSAN_OPTIONS=print_stacktrace=1
          set +e
          /tmp/repro_cfl 6 14 40 2>&1 | tail -60
          echo "exit=$?"
