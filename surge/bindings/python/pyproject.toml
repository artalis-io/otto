[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "surge-solver"
version = "0.1.0"
description = "Python bindings for the Surge vehicle routing solver"
requires-python = ">=3.10"
license = "Proprietary"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
