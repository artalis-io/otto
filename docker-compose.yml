version: '3.8'

# =============================================================================
# OTTO Platform - Docker Compose Configuration
# =============================================================================
#
# Usage:
#   docker-compose up carta velo locus    # GIS trifecta
#   docker-compose up fuelwise ralph      # Optimization services
#   docker-compose up                     # All services
#
# With custom data:
#   PBF_FILE=/path/to/map.osm.pbf docker-compose up carta velo locus
#
# Security: All services run as non-root with minimal attack surface.
# See docs/internals/security-model.md for security architecture.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Carta Tile Server (MVT/PNG)
  # ---------------------------------------------------------------------------
  carta:
    build:
      context: .
      dockerfile: docker/Dockerfile.carta
    ports:
      - "8081:8081"
    volumes:
      - ${DATA_DIR:-./data}:/data:ro
    command: ["${PBF_FILE:-/data/map.osm.pbf}"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ---------------------------------------------------------------------------
  # Velo Route Server
  # ---------------------------------------------------------------------------
  velo:
    build:
      context: .
      dockerfile: docker/Dockerfile.velo
    ports:
      - "8082:8082"
    volumes:
      - ${DATA_DIR:-./data}:/data:ro
    command: ["${PBF_FILE:-/data/map.osm.pbf}"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ---------------------------------------------------------------------------
  # Locus Geocoder
  # ---------------------------------------------------------------------------
  locus:
    build:
      context: .
      dockerfile: docker/Dockerfile.locus
    ports:
      - "8083:8083"
    volumes:
      - ${DATA_DIR:-./data}:/data:ro
    command: ["${PBF_FILE:-/data/map.osm.pbf}"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ---------------------------------------------------------------------------
  # FuelWise Refueling Optimizer
  # ---------------------------------------------------------------------------
  fuelwise:
    build:
      context: .
      dockerfile: docker/Dockerfile.fuelwise
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ---------------------------------------------------------------------------
  # Ralph LP/MIP Solver
  # ---------------------------------------------------------------------------
  ralph:
    build:
      context: .
      dockerfile: docker/Dockerfile.ralph
    ports:
      - "8084:8084"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 8G

# =============================================================================
# Networks
# =============================================================================
networks:
  default:
    name: otto-network
